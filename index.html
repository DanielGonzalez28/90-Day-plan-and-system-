<style>
:root{
  --bg:#230e04;--card:#2c1409;--card2:#37190b;--line:#4b2714;--line2:#5e3419;
  --lime:#d4e590;--lime-ink:#1c1200;--ink:#f4ecdc;--muted:rgba(244,236,220,.58);--faint:rgba(244,236,220,.22);
  --mono:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --display:'Inter Tight','Inter',system-ui,-apple-system,sans-serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{min-height:100dvh;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;outline:none;color:var(--ink);-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--lime)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
::placeholder{color:var(--faint)}
a{color:var(--lime)}

.strip{padding:calc(var(--sat) + 14px) 18px 12px;display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;letter-spacing:.21em;text-transform:uppercase;color:var(--ink)}
.strip .mid{display:none;color:var(--muted)}
.strip .dates{color:var(--lime)}
.shell{flex:1;display:flex;flex-direction:column;width:100%}
main{flex:1;padding:6px 18px calc(var(--sab) + 92px);max-width:720px;width:100%;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(35,14,4,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 10px calc(var(--sab) + 8px);z-index:20}
nav.tabs button{flex:1;padding:10px 4px;border-radius:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current]{color:var(--lime-ink);background:var(--lime)}
@media (min-width:900px){
  .shell{flex-direction:row}
  .strip{position:fixed;top:0;left:0;right:0;z-index:10;background:var(--bg);padding:22px 50px}
  .strip .mid{display:block}
  nav.tabs{position:fixed;top:92px;left:50px;bottom:auto;right:auto;width:170px;flex-direction:column;gap:4px;border:0;background:transparent;padding:0;backdrop-filter:none}
  nav.tabs button{text-align:left;padding:10px 12px}
  main{margin:92px auto 60px;padding:0 50px 0 260px;max-width:1440px}
  .wide2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
  .wide3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
  .wide2>*,.wide3>*{min-width:0}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.eyebrow b{color:var(--lime);font-weight:500}
.display{font-family:var(--display);font-weight:400;letter-spacing:-.05em;line-height:1;color:var(--lime)}
.bar{background:var(--lime);color:var(--lime-ink);border-radius:5px;padding:7px 10px;font-weight:500;font-size:15px;margin:18px 0 6px;display:flex;justify-content:space-between;align-items:center}
.bar:first-child{margin-top:0}
.bar small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;font-weight:400}
.goal{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.hint{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:10px;border:1px solid var(--line2);font-weight:500;font-size:14px;color:var(--ink)}
.btn.primary{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.btn.block{width:100%}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line2);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

.tg{display:flex;align-items:center;gap:10px;width:100%;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);text-align:left;font-size:14.5px;line-height:1.3}
.tg:last-child{border-bottom:0}
.tg .tl{flex:1}
.tg .tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.sw{flex:none;width:36px;height:21px;border-radius:12px;background:rgba(244,236,220,.14);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--ink);opacity:.5;transition:transform .15s,opacity .15s}
.tg[aria-pressed="true"] .sw{background:var(--lime)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(15px);background:var(--lime-ink);opacity:1}
.tg[aria-pressed="true"] .tl{color:var(--lime)}
.tg:disabled{cursor:default}

.grid90{display:grid;grid-template-columns:repeat(9,1fr);gap:7px;width:100%;max-width:230px}
.grid90 i{display:block;aspect-ratio:1;background:rgba(212,229,144,.16);border-radius:2px}
.grid90 i.on{background:var(--lime)}
.grid90 i.now{background:transparent;box-shadow:inset 0 0 0 2px var(--lime);animation:pulse 1.6s ease-in-out infinite}
.grid90 i.c{border-radius:50%}
.grid90 i.d{transform:rotate(45deg) scale(.8)}
@keyframes pulse{50%{opacity:.35}}

.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:10px 0 18px}
.dayhead .n{font-size:84px}
.dayhead .n span{font-size:28px;color:var(--muted);letter-spacing:-.02em;margin-left:4px}
.dayhead .date{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px;display:flex;gap:10px;align-items:center}
.dayhead .date button{color:var(--lime);font-size:18px;line-height:1;padding:0 4px}
.money .big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.money .target{font-family:var(--display);font-size:40px;letter-spacing:-.04em;color:var(--lime)}
.money input{width:150px;font-family:var(--mono);font-size:18px;text-align:right}
.money .pace{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:10px;line-height:1.8}

.nmrow{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
.nmrow .top{display:flex;gap:8px;align-items:center}
.nmrow .pri{flex:none;width:30px;height:30px;border-radius:8px;background:var(--lime);color:var(--lime-ink);font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:500}
.nmrow .pri.dim{background:rgba(244,236,220,.12);color:var(--muted)}
.nmrow input.txt{background:transparent;border:0;padding:4px 0;font-size:15px}
.nmrow .ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.nmrow .ctl input.needs{flex:1;min-width:120px;padding:6px 9px;font-size:12px;font-family:var(--mono)}
.nmrow .mv{font-family:var(--mono);font-size:14px;color:var(--muted);padding:0 4px}
.nmrow .val{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.nmrow .val input{width:92px;padding:5px 8px;font-family:var(--mono);font-size:13px;text-align:right;color:var(--lime)}
.nmrow .val .est{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.nmrow .carried{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#e8a17a}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sum b{font-family:var(--display);font-size:26px;letter-spacing:-.04em;color:var(--lime);font-weight:400;text-transform:none;letter-spacing:-.04em}
.sum b.short{color:#e8a17a}
.gapbox{background:var(--card2);border:1px solid #e8a17a;border-radius:10px;padding:12px;margin:10px 0 0;font-size:13.5px;line-height:1.5}
.gapbox b{color:#e8a17a;font-weight:500}
.ask{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-size:13.5px}
.ask .row{margin-top:8px}
.ask button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line2);font-weight:500}
.ask button.y{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.carry{margin-top:8px;border-top:1px solid rgba(244,236,220,.08);padding-top:8px}
.carry textarea{min-height:54px;font-size:13px;margin:4px 0 8px}
.carry .q{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.earned .l{color:var(--lime)}
.noearn .l{color:#e8a17a}
.core{border-color:var(--lime)}
.mvrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(244,236,220,.08);font-size:14px}
.mvrow .v{font-family:var(--display);font-size:18px;letter-spacing:-.03em;color:var(--lime)}
.mvrow .v.z{color:var(--faint)}
.mvrow small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,236,220,.45);margin-top:2px}
.mvrow select{width:auto;padding:6px 9px;font-size:12px;font-family:var(--mono);margin-top:6px}
.flag{background:#3a1a0a;border:1px solid #e8a17a;border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:13.5px;line-height:1.5}
.flag b{color:#e8a17a;font-weight:500}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.months div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px}
.months .v{font-family:var(--display);font-size:22px;letter-spacing:-.04em;color:var(--lime)}
.months .v small{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em;display:block;margin-top:2px}

.slot{display:grid;grid-template-columns:52px 1fr 30px;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid rgba(244,236,220,.08)}
.slot .t{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);line-height:1.5}
.slot .l{font-size:14.5px;line-height:1.3}
.slot .l small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(244,236,220,.45);margin-top:3px}
.slot .l .out{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.slot .l .out b{color:var(--lime);font-weight:500}
.slot.sop .l{color:rgba(244,236,220,.8)}
.slot.now{background:var(--card2);border-radius:10px;border-top-color:transparent}
.slot.now .t{color:var(--lime)}
.slot.mute .l,.slot.mute .t{color:rgba(244,236,220,.3)}
.slot.over .t,.slot.over .l{color:#e8a17a}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(244,236,220,.3);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--lime-ink);justify-self:end}
.ck.on{background:var(--lime);border-color:var(--lime)}
.hours{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;margin:6px 0 2px}
.hc{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.hc span{font-size:13px;font-weight:500}
.hc[data-v="y"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.hc[data-v="n"]{color:var(--ink);border-color:var(--ink);text-decoration:line-through}
.gate{padding:28px 20px;text-align:center}
.gate .display{font-size:34px;margin-bottom:12px}
.lesson{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(244,236,220,.08)}
.lesson .ck{margin-top:2px;flex:none}
.lesson .d{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.lesson .a{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.lesson .a b{color:var(--lime);font-weight:500}
.pinned{border-color:var(--lime)}

.cover{padding:30px 0 10px}
.cover .display{font-size:52px}
.cover .mission{font-family:var(--display);font-size:22px;letter-spacing:-.03em;color:var(--ink);margin:12px 0 0}
.cover .prog{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.cover .arrow{display:inline-block;margin-left:8px}
.manifesto{margin:18px 0 0;padding:0;list-style:none}
.manifesto li{padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.pillar{padding:18px 16px 14px}
.pillar .display{font-size:46px;margin:6px 0 14px}
.gcard{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 8px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.gcard .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gcard .top b{color:var(--ink);font-weight:500;font-size:16px;font-family:var(--display);letter-spacing:-.02em;text-transform:none}
.gcard p{margin:0;font-size:13.5px;line-height:1.5}
.daily{list-style:none;padding:0;margin:8px 0 0}
.daily li{font-size:14px;line-height:1.5;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
.routine{list-style:none;padding:0;margin:0}
.routine li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px;line-height:1.5}
.routine li:first-child{border-top:0}
.routine li span{font-family:var(--mono);font-size:12px;color:var(--lime);letter-spacing:.06em;padding-top:2px}
.edit input,.edit textarea{margin:4px 0 8px;font-size:13px}
.edit label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}

.score{display:flex;align-items:baseline;gap:14px}
.score .display{font-size:64px}
.score .of{color:var(--muted);font-size:18px;font-family:var(--mono)}
.srow{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid rgba(255,255,255,.06);font-size:14px}
.srow .v{font-family:var(--display);font-size:22px;letter-spacing:-.03em;color:var(--lime)}
.srow .v small{font-size:12px;color:var(--muted);font-family:var(--mono);letter-spacing:0}
.srow.head{border-top:0;padding-top:0}
.srow.head span:first-child{font-weight:500}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px}
.kv .eyebrow{margin-bottom:6px}
.kv .v{font-family:var(--display);font-size:28px;letter-spacing:-.04em;color:var(--lime)}
.kv .v small{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;margin-left:4px}
.wk textarea{margin:6px 0 10px}
.ynq{display:flex;gap:8px;margin:8px 0 2px}
.ynq button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--line2);font-weight:500}
.ynq button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}

.field{margin:0 0 12px}
.field label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.status{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted)}

.banner{position:fixed;left:14px;right:14px;top:calc(var(--sat) + 12px);z-index:40;background:var(--lime);color:var(--lime-ink);border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:none}
.banner.show{display:block}

.banner button{flex:1;padding:10px;border-radius:9px;background:var(--lime-ink);color:var(--lime);font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 104px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
@media (min-width:900px){.toast{bottom:40px}}
</style>
</head>

function buildSchedule(d, s) {
  const nms = d.nm.map((n, i) => ({ ...n, i })).filter(n => n.text.trim() && !n.who);   // delegated movers don't take your time
  const all = d.nm.map((n, i) => i).filter(i => d.nm[i].text.trim());
  const order = (d.order && d.order.length === all.length) ? d.order : all;   // priority = position in `order`
  const ranked = order.map(i => nms.find(n => n.i === i)).filter(Boolean);
  const blocks = s.blocks.map(b => ({ ...b, s: hm(b.start), e: hm(b.end), cap: hm(b.end) - hm(b.start), list: [] }));
  const morningFocus = /morning/i.test(s.card) && !/evening/i.test(s.card.split('.')[0]);
  const outreachItem = allItems().find(it => /outreach/i.test(it.l));
  const SOP_OUTREACH = 90;
  const nmIsOutreach = n => /outreach|dm|call|lead|sell|pitch/i.test(n.text);
  // 1. assign blocks
  for (const n of ranked) {
    let b = null;
    if (n.when === 'am') b = blocks[0]; else if (n.when === 'pm') b = blocks[blocks.length - 1];
    else if (/^\d\d:\d\d$/.test(n.when)) { const t = hm(n.when); b = blocks.find(x => t >= x.s && t < x.e) || blocks[0]; }
    else { const est = n.min || 120; b = blocks.find(x => x.cap - x.list.reduce((a, y) => a + (y.min || 120), 0) >= est) || (morningFocus ? blocks[0] : blocks[blocks.length - 1]); }
    b.list.push(n);
  }
  // 2. durations: fixed minutes honoured, the rest share what's left (rounded to 15, min 30)
  const slots = [];
  for (const b of blocks) {
    const reserve = (b === blocks[blocks.length - 1] && outreachItem && !b.list.some(nmIsOutreach)) ? SOP_OUTREACH : 0;
    const fixedSum = b.list.filter(n => n.min).reduce((a, n) => a + n.min, 0);
    const autos = b.list.filter(n => !n.min);
    const share = autos.length ? Math.max(30, Math.floor((b.cap - reserve - fixedSum) / autos.length / 15) * 15) : 0;
    let t = b.s;
    const timed = b.list.filter(n => /^\d\d:\d\d$/.test(n.when)).sort((a, c) => hm(a.when) - hm(c.when));
    const rest = b.list.filter(n => !/^\d\d:\d\d$/.test(n.when));
    const seq = [...rest, ...timed].sort((a, c) => { const ta = /^\d\d:\d\d$/.test(a.when) ? hm(a.when) : -1, tc = /^\d\d:\d\d$/.test(c.when) ? hm(c.when) : -1; return (ta < 0 && tc < 0) ? 0 : (ta < 0 ? -1 : tc < 0 ? 1 : ta - tc); });
    for (const n of seq) {
      if (/^\d\d:\d\d$/.test(n.when)) t = Math.max(t, hm(n.when));
      const min = n.min || share; const end = t + min;
      slots.push({ kind: 'nm', i: n.i, block: b.id, start: t, end, min, over: end > b.e, text: n.text, needs: n.needs });
      t = end;
    }
    if (reserve) { slots.push({ kind: 'sop', id: outreachItem.id, block: b.id, start: t, end: t + reserve, min: reserve, text: outreachItem.l, over: t + reserve > b.e }); t += reserve; }
  }
  for (const f of s.fixed) slots.push({ kind: 'fixed', start: hm(f.at), end: hm(f.at), min: 0, text: f.text });
  for (const b of blocks) slots.push({ kind: 'block', start: b.s, end: b.e, text: b.label, block: b.id });
  slots.sort((a, c) => a.start - c.start || (a.kind === 'block' ? -1 : 1));
  return slots;
}

      whos: (s.whos || []).map(w => w.name + (w.does ? ' — ' + w.does : '')),
      goals: p.pillars.map(x => ({ pillar: x.name, line: x.line, goals: x.goals.map(g => ({ title: g.title, desc: g.desc })) })), outcome: p.outcome,
      needleMovers: nmFilled(d).map((n, idx) => ({ i: d.nm.indexOf(n), text: n.text, priority: idx + 1, needs: n.needs, when: n.when, minutes: n.min || null, who: n.who || 'me', valueSetByUser: n.valueSet ? Number(n.value) : null, carriedFrom: n.carriedFrom || null })),
      draft: draft.filter(x => x.kind === 'nm').map(x => ({ i: x.i, start: mh(x.start), end: mh(x.end) })) });
    if (res && Array.isArray(res.nm)) {
      aiOk = true; ai = { nm: {}, note: res.note || '', gap: res.gap || '', leverage: res.leverage || '' };
      for (const x of res.nm) if (x && typeof x.i === 'number' && d.nm[x.i]) {
        ai.nm[x.i] = { outcome: String(x.outcome || ''), metric: Array.isArray(x.metric) ? x.metric.map(String) : [], why: String(x.why || '') };
        if (!d.nm[x.i].valueSet && Number.isFinite(Number(x.value))) d.nm[x.i].value = Math.max(0, Math.round(Number(x.value)));   // the AI's assessment, unless you overrode it
      }
      if (Array.isArray(res.order) && res.order.length === nmFilled(d).length) d.order = res.order;
      aiState = 'on';
    }
  } catch (e) { console.warn('AI planner unavailable:', e.message); aiState = /AI 4|AI 5|Sign in/.test(e.message) ? 'off' : 'offline'; }
  if (!aiOk) fillDefaultValues(d, s);
  d.ai = ai;
  // the gate: the day is not built until the movers add up to the day — by you or by a who
  if (!dayWorth(d, s)) { d.gap = { short: dayShort(d, s), note: ai?.gap || '' }; d.built = null; setDay(k, d); S.building = false; render(); return toast(`Day is worth ${money(plannedValue(d))} of ${money(s.dayTarget)}`); }
  d.gap = null;
  const sched = buildSchedule(d, s);
  d.built = sched.map(x => ({ ...x })); d.builtAt = Date.now();
  setDay(k, d); S.building = false; render();
  toast(ai ? 'Day built — every mover priced' : 'Day built (AI not connected — values are an even split)');
}
async function annotateLessons(items) {
  try { const res = await callAI({ action: 'annotate', lessons: items.map(x => ({ date: x.date, text: x.text })), card: settings().card, outcome: plan().outcome });
    if (res && Array.isArray(res.notes)) { for (const n of res.notes) { const d = getDay(n.date); if (d.learned && !d.learnedNote) { d.learnedNote = String(n.note || ''); setDay(n.date, d); } } render(); }
  } catch (e) { console.warn('annotate skipped:', e.message); }
}

const app = document.getElementById('app');
function tg(item, on) { return `<button class="tg${item.auto ? ' auto' : ''}" data-t="${item.id}" aria-pressed="${on}" ${item.auto ? 'disabled' : ''}><span class="tl">${esc(item.l)}</span>${item.auto ? '<span class="tag">auto</span>' : ''}<span class="sw"></span></button>`; }
function grid(n) {
  let h = '';
  for (let i = 0; i < CFG.DAYS; i++) {
    const dk = dateOfIndex(i + 1);
    const cls = [i + 1 < n ? 'on' : i + 1 === n ? 'now' : '', isSunday(dk) ? 'c' : '', isMonthEnd(dk) ? 'd' : ''].filter(Boolean).join(' ');
    h += `<i class="${cls}" title="${dk}${isSunday(dk) ? ' · Sunday review' : ''}${isMonthEnd(dk) ? ' · month end' : ''}"></i>`;

}
function renderStrip() {

function renderIfMore() { if (S.view === 'more') render(); else renderStrip(); }
const dayHead = (k) => {
  const n = dayIndex(k), t = todayKey();

      <div class="eyebrow">${inPlan(k) ? (isSunday(k) ? 'Day · Sunday review' : isMonthEnd(k) ? 'Day · month end' : 'Day') : 'Outside the 90'}</div>

};

/* ---- Today ---- */
function vToday() {

  const sc = dayScore(k), cash = totalRevenue(k), pace = Math.max(0, Math.min(n, CFG.DAYS)) * s.dayTarget;
  const filled = nmFilled(d), order = (d.order && d.order.length === filled.length) ? d.order : filled.map(x => d.nm.indexOf(x));

  // needle movers input
  const whos = s.whos || [];
  const whoChips = (x, i) => `<button class="chip" data-who="" data-i="${i}" aria-pressed="${!x.who}">Me</button>` + whos.map(w => `<button class="chip" data-who="${esc(w.name)}" data-i="${i}" aria-pressed="${x.who === w.name}">${esc(w.name)}</button>`).join('') + `<button class="chip" data-act="addwho">+ who</button>`;
  const whenChips = (x, i) => ['am','pm','any'].map(w => `<button class="chip" data-when="${w}" data-i="${i}" aria-pressed="${x.when === w}">${{ am: 'Morning', pm: 'Evening', any: 'Anytime' }[w]}</button>`).join('') + `<input class="chip" type="time" data-whent="${i}" value="${/^\d\d:\d\d$/.test(x.when) ? x.when : ''}" style="width:88px;padding:4px 6px;border-radius:999px">`;
  const minChips = (x, i) => [0,30,60,90,120,150].map(m => `<button class="chip" data-min="${m}" data-i="${i}" aria-pressed="${(x.min||0) === m}">${m ? m + 'm' : 'auto'}</button>`).join('');
  const carryBox = (x, i) => {
    if (x.earned === 'y') return '';
    const ok = x.carryWhy.adds && x.carryWhy.moves && x.carryWhy.leverage;
    return `<div class="carry"><button class="tg" data-carry="${i}" aria-pressed="${!!x.carry}"><span class="tl">Carry to tomorrow</span><span class="tag">${x.carry ? (ok ? 'will carry' : 'answer all three') : 'dies at midnight'}</span><span class="sw"></span></button>
      ${x.carry ? `<div class="q">What does it add to the overall goal, and why does it add value?</div><textarea data-cw="adds.${i}">${esc(x.carryWhy.adds)}</textarea>
      <div class="q">What moves with that task done, and why?</div><textarea data-cw="moves.${i}">${esc(x.carryWhy.moves)}</textarea>

  };
  const nmRows = d.nm.map((x, i) => { const r = rank(i); const f = !!x.text.trim(); const a = d.ai?.nm?.[i]; return `
    <div class="nmrow">
      <div class="top"><div class="pri ${f ? '' : 'dim'}">${f ? pad(r + 1) : pad(i + 1)}</div><input class="txt" data-nm="${i}" value="${esc(x.text)}" placeholder="${i < 3 ? 'What moves the needle today?' : 'Optional'}">
        ${f ? `<button class="mv" data-up="${i}" ${r <= 0 ? 'disabled' : ''} aria-label="Higher priority">↑</button><button class="mv" data-down="${i}" ${r >= filled.length - 1 ? 'disabled' : ''} aria-label="Lower priority">↓</button>` : ''}</div>
      ${x.carriedFrom ? `<div class="carried" style="margin-top:6px">Carried from day ${dayIndex(x.carriedFrom)}</div>` : ''}
      ${f ? `<div class="ctl"><div class="val">$<input data-val="${i}" inputmode="numeric" value="${x.value || ''}" placeholder="worth"><span class="est">${x.valueSet ? 'yours' : (d.ai ? 'AI' : 'estimate')}</span></div><input class="needs" data-needs="${i}" value="${esc(x.needs)}" placeholder="needs: quiet · laptop · a call with…"></div>
      ${a?.why ? `<p class="hint" style="margin:6px 0 0">${esc(a.why)}</p>` : ''}
      <div class="ctl">${whoChips(x, i)}</div>${x.who ? '' : `<div class="ctl">${whenChips(x, i)}</div><div class="ctl">${minChips(x, i)}</div>`}

  const addRow = d.nm.length < 5 ? `<button class="btn sm" data-act="addnm">+ add a line</button>` : '';
  const short = dayShort(d, s);
  const gapBox = d.gap ? `<div class="gapbox"><b>Worth ${money(worth)} of ${money(s.dayTarget)}.</b> ${money(short)} short. Add a mover, raise a value you can defend, or give one to a who.${d.gap.note ? `<br>${esc(d.gap.note)}` : ''}${d.ai?.leverage ? `<br><b>2× leverage:</b> ${esc(d.ai.leverage)}` : ''}</div>` : '';
  const nmCard = `<div class="card nm"><div class="eyebrow"><span>Needle movers</span><b id="nmcount">${filled.length}/3</b></div>${nmRows}${addRow}
      <div class="sum"><span>Day is worth</span><b class="${worth >= s.dayTarget - 1 ? '' : 'short'}">${money(worth)}<span style="font-size:13px;color:var(--muted);letter-spacing:0;font-family:var(--mono)"> / ${money(s.dayTarget)}</span></b></div>${gapBox}
      <p class="hint">Priority = order. $ = how much of the day this mover carries — would someone pay that for the result? Me or a who. Then build.</p>
      <button class="btn primary block" data-act="build" ${S.building ? 'disabled' : ''} style="margin-top:10px">${S.building ? 'Pricing the day…' : d.built ? 'Rebuild my day' : 'Price and build my day'}</button></div>`;
  // timeline
  let timeline = '';
  if (d.built) {
    const items = allItems(); const byId = Object.fromEntries(items.map(x => [x.id, x]));
    const now = (k === t) ? new Date().getHours() * 60 + new Date().getMinutes() : -1;
    const victory = plan().pillars.find(p => p.id === 'm'); const vi = victory ? victory.goals[0].items.map((l, ii) => ({ id: itemId(plan().pillars.indexOf(victory), 0, ii), l, auto: autoKind(l) })) : [];
    const askRow = (i, x) => S.ask === i ? `<div class="ask">Worth <b style="color:var(--lime);font-weight:500">${money(x.value)}</b> — did it produce that?<div class="row"><button class="y" data-earn="y" data-i="${i}">Yes, earned</button><button data-earn="n" data-i="${i}">No</button></div></div>` : '';

      const state = x.earned === 'y' ? 'earned' : x.earned === 'n' ? 'noearn' : '';
      return `<div class="slot ${state} ${sl && now >= sl.start && now < sl.end ? 'now' : ''} ${sl?.over ? 'over' : ''}"><div class="t">${timeHtml}</div><div class="l">${esc(x.text)}<small>${sub}</small>${out}</div><button class="ck ${x.earned ? 'on' : ''}" data-nmdone="${i}">${x.earned === 'y' ? '✓' : x.earned === 'n' ? '×' : ''}</button></div>${askRow(i, x)}`; };
    const rows = [];
    for (const sl of d.built) {

        if (sl.start === hm('22:00')) continue;
        rows.push(`<div class="slot sop mute"><div class="t">${clock(sl.start)}</div><div class="l">${esc(sl.text)}</div><div></div></div>`); continue;
      }
      if (sl.kind === 'nm') { const x = d.nm[sl.i]; if (!x) continue; rows.push(nmSlot(sl, x, sl.i, `${clock(sl.start)}<br>${clock(sl.end)}`, `${money(x.value)} · needle mover ${pad(rank(sl.i) + 1)} · ${sl.min} min${x.needs ? ' · needs ' + esc(x.needs) : ''}${sl.over ? ' · does not fit — cut or shrink' : ''}`)); }
      if (sl.kind === 'sop') { const it = byId[sl.id]; if (!it) continue; const isNow = now >= sl.start && now < sl.end; rows.push(`<div class="slot sop ${isNow ? 'now' : ''}"><div class="t">${clock(sl.start)}<br>${clock(sl.end)}</div><div class="l">${esc(it.l)}<small>SOP · ${sl.min} min</small></div><button class="ck ${isOn(it, k, d) ? 'on' : ''}" data-t="${it.id}">${isOn(it, k, d) ? '✓' : ''}</button></div>`); }

  } else {

  }

/* ---- Week ---- */
function vWeek() {
  const mon = S.week, w = getWeek(mon), ws = weekScores(mon), s = settings(), p = plan();
  const sun = ymd(addDays(parse(mon), 6));
  const weekTarget = s.dayTarget * 7;
  const score = v => `<span class="v">${v.toFixed(v >= 10 ? 0 : 2)}<small> /10</small></span>`;
  const rows = ws.pillars.map(pl => `<div class="srow head" style="margin-top:14px"><span>${esc(pl.name)}</span>${score(pl.score)}</div>${pl.goals.map(g => `<div class="srow"><span class="muted small">${g.n} — ${esc(g.title)}</span>${score(g.score)}</div>`).join('')}`).join('');
  const flag = valueCashFlag();
  const flagBox = flag ? `<div class="flag"><b>Value says yes, cash says no.</b> Last 14 days: ${money(flag.val)} of value earned, ${money(flag.cash)} in cash. The values are wrong. Reprice the movers against what the market actually pays.</div>` : '';
  // 20% inside the 20%: the week's movers by earned value; you mark the core; the rest get a who
  const core = new Set(w.core || []); const delegate = w.delegate || {};

  const mono = (sz, col) => { x.font = `500 ${sz}px "DM Mono", monospace`; x.fillStyle = col; try { x.letterSpacing = Math.round(sz * .2) + 'px'; } catch {} };
  const disp = (sz, col) => { x.font = `400 ${sz}px "Inter Tight", "Inter", sans-serif`; x.fillStyle = col; try { x.letterSpacing = Math.round(-sz * .05) + 'px'; } catch {} };
  const body = (sz, col) => { x.font = `400 ${sz}px "Inter", sans-serif`; x.fillStyle = col; try { x.letterSpacing = '0px'; } catch {} };
  mono(26, '#f4ecdc'); x.fillText(s.name.toUpperCase(), 72, 760);
  mono(26, '#d4e590'); x.textAlign = 'right'; x.fillText(CFG.APP, W - 72, 760); x.textAlign = 'left';
  disp(260, '#d4e590'); x.fillText(`Day ${inPlan(k) ? n : '—'}`, 60, 1010);
  mono(26, 'rgba(244,236,220,.6)'); x.fillText(`OF ${CFG.DAYS}  ·  ${money(s.dayTarget).toUpperCase()} TODAY  ·  $${s.hourRate} AN HOUR`, 72, 1070);
  disp(44, '#f4ecdc'); x.fillText(s.mission || CFG.MISSION, 72, 1130);
  let y = 1230;
  x.fillStyle = '#d4e590'; x.fillRect(72, y - 42, W - 144, 56); disp(34, '#1c1200'); x.fillText('Today', 90, y); y += 70;
  const slots = (d.built || []).filter(sl => sl.kind === 'nm' || sl.kind === 'sop');
  const filled = nmFilled(d);
  if (slots.length) { for (const sl of slots.slice(0, 6)) { mono(24, '#d4e590'); x.fillText(clock(sl.start), 72, y); body(34, '#f4ecdc'); x.fillText(String(sl.text).slice(0, 38), 230, y); if (sl.kind === 'nm' && d.nm[sl.i]) { mono(22, 'rgba(244,236,220,.6)'); x.textAlign = 'right'; x.fillText(money(d.nm[sl.i].value), W - 72, y); x.textAlign = 'left'; } y += 60; } }
  else if (filled.length) { for (const nm of filled.slice(0, 5)) { x.fillStyle = '#d4e590'; x.fillRect(72, y - 24, 10, 10); body(36, '#f4ecdc'); x.fillText(nm.text.slice(0, 48), 104, y); y += 60; } }
  else { body(36, 'rgba(244,236,220,.4)'); x.fillText('Not written yet. Decide first.', 72, y); y += 60; }
  y += 40; for (const pl of p.pillars) { mono(22, '#d4e590'); x.fillText(pl.name.toUpperCase(), 72, y); body(26, 'rgba(244,236,220,.75)'); x.fillText(pl.goals.map((g, gi) => `${pad(gi + 1)} ${g.title}`).join('   '), 72, y + 40); y += 100; }
  const cell = 46, gap = 26, gx = (W - (9 * cell + 8 * gap)) / 2, gy = H - 180 - (10 * cell + 9 * gap);
  for (let i = 0; i < CFG.DAYS; i++) {
    const cx = gx + (i % 9) * (cell + gap), cy = gy + Math.floor(i / 9) * (cell + gap), dk = dateOfIndex(i + 1), done = i + 1 < n, cur = i + 1 === n;
    x.fillStyle = done || cur ? '#d4e590' : 'rgba(212,229,144,.18)'; x.save(); x.translate(cx + cell / 2, cy + cell / 2);
    if (isSunday(dk)) { x.beginPath(); x.arc(0, 0, cell / 2, 0, 7); x.fill(); }
    else if (isMonthEnd(dk)) { x.rotate(Math.PI / 4); x.fillRect(-cell * .4, -cell * .4, cell * .8, cell * .8); }
    else if (cur) { x.strokeStyle = '#d4e590'; x.lineWidth = 5; x.strokeRect(-cell / 2 + 3, -cell / 2 + 3, cell - 6, cell - 6); }
    else x.fillRect(-cell / 2, -cell / 2, cell, cell);
    x.restore();
  }
  c.toBlob(async b => { const f = new File([b], `day-${n}-wallpaper.png`, { type: 'image/png' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { try { await navigator.share({ files: [f], title: `Day ${n}` }); } catch {} } else { const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = f.name; l.click(); setTimeout(() => URL.revokeObjectURL(u), 5000); } }, 'image/png');
}

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view) { S.view = v; render(); } });
render();
initSupabase();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
